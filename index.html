<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ôn từ vựng Environment</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f3;--cd:#fff;--tx:#1b2a22;--mu:#5f6f66;--ac:#2b7a57;--ln:#d9e2dc;--ok:#1e8a4b;--bd:#c53a3a;--okb:#e0f3e8;--bdb:#fbe4e4}
:root[data-t=dark]{--bg:#0f1512;--cd:#17201b;--tx:#e5eee8;--mu:#93a49b;--ac:#4dbd88;--ln:#2a382f;--ok:#4fd08a;--bd:#f07272;--okb:#173a28;--bdb:#40201f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 'Be Vietnam Pro',system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;max-width:820px;margin:0 auto;padding:14px 16px 6px}
h1{font-size:1.15rem;margin:0}
main{max-width:820px;margin:0 auto;padding:8px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tabs{display:flex;gap:6px;margin:8px 0 14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--ln);background:var(--cd);border-radius:10px;font-weight:500}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sub button{font-size:.9rem;padding:8px 4px}
.b{padding:10px 16px;border:1px solid var(--ln);background:var(--cd);border-radius:10px}
.b:disabled{opacity:.45;cursor:default}
.pr{background:var(--ac);color:#fff;border-color:var(--ac);margin-top:14px;font-weight:500}
.card,.qc{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:16px}
.c{text-align:center;padding:24px 16px}
.c h2{font-size:1.9rem;margin:.2em 0}
.ipa{font-size:1.15rem;color:var(--ac);margin:0}
.vi{font-size:1.05rem;margin:.4em 0 1em}
.mu{color:var(--mu);font-size:.9rem;margin:.4em 0}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.mic{width:78px;height:78px;border-radius:50%;border:none;background:var(--ac);font-size:2rem;margin:12px 0 4px}
.mic.rec{background:var(--bd);animation:p 1.1s infinite}
@keyframes p{50%{box-shadow:0 0 0 14px rgba(197,58,58,.25)}}
@media(prefers-reduced-motion:reduce){.mic.rec{animation:none}}
.fb{min-height:3.2em;padding:8px 12px;border-radius:10px;margin:8px 0;font-size:.95rem;text-align:left}
.fb.ok{background:var(--okb);color:var(--ok)}.fb.bad{background:var(--bdb);color:var(--bd)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mt>div,.op{display:flex;flex-direction:column;gap:8px}
.it{padding:10px 12px;text-align:left;border:2px solid var(--ln);background:var(--cd);border-radius:10px}
.it.lk{border-color:hsl(var(--h) 55% 50%);background:hsl(var(--h) 60% 50%/.18)}
.it.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.it.ok{border-color:var(--ok);background:var(--okb)}.it.bd{border-color:var(--bd);background:var(--bdb)}
.qc{margin:10px 0}.qc p{margin:0 0 8px}
.op{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bl{border-bottom:2px solid var(--ac);font-weight:700;color:var(--ac);padding:0 4px}
input{font:inherit;color:inherit;background:var(--bg);border:2px solid var(--ln);border-radius:8px;padding:3px 8px;width:11em;max-width:100%}
input.ok{border-color:var(--ok)}input.bd{border-color:var(--bd)}
.fix{color:var(--ok);font-size:.9rem}
.bank{display:flex;flex-wrap:wrap;gap:6px;padding:12px;background:var(--cd);border:1px dashed var(--ac);border-radius:12px}
.bank span{padding:3px 10px;background:var(--bg);border:1px solid var(--ln);border-radius:20px;font-size:.9rem}
.sc{font-weight:700;font-size:1.1rem;margin:14px 0 4px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#md.on{display:flex}
.box{background:var(--cd);border-radius:16px;padding:22px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
.big{font-size:2.6rem;font-weight:700;color:var(--ac);margin:0}
@media(max-width:520px){.mt,.op{grid-template-columns:1fr}.mt{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>Environment · Ôn từ vựng</h1><button class="b" data-a="theme" aria-label="Đổi nền sáng/tối">🌓 Sáng/Tối</button></header>
<main>
<div class="tabs"><button data-a="mode" data-v="sp">Speaking</button><button data-a="mode" data-v="rd">Reading</button></div>
<div id="app"></div>
</main>
<div id="md"><div class="box" id="mb"></div></div>
<script>
const D=`individual action|/ˌɪndɪˈvɪdʒuəl ˈækʃn/|hành động cá nhân|Even small ____, like saving water, can make a difference.
collective pressure|/kəˈlektɪv ˈpreʃər/|áp lực tập thể|____ from local residents forced the factory to clean up.
daily consumption habits|/ˈdeɪli kənˈsʌmpʃn ˈhæbɪts/|thói quen tiêu dùng hằng ngày|Changing our ____ is the first step to a greener life.
plastic pollution|/ˈplæstɪk pəˈluːʃn/|ô nhiễm rác thải nhựa|____ is choking rivers and beaches around the world.
public awareness|/ˈpʌblɪk əˈwernəs/|nhận thức của công chúng|Campaigns have raised ____ of the climate crisis.
sustainable choices|/səˈsteɪnəbl ˈtʃɔɪsɪz/|các lựa chọn bền vững|Cycling to school is one of many ____ students can make.
corporate behaviour|/ˈkɔːrpərət bɪˈheɪvjər/|hành vi của doanh nghiệp|Investors are now watching ____ more closely than before.
government policy|/ˈɡʌvərnmənt ˈpɑːləsi/|chính sách của chính phủ|A new ____ will ban coal power plants by 2040.
greenwashing|/ˈɡriːnwɑːʃɪŋ/|tẩy xanh|The ad was pure ____: the brand claimed to be eco-friendly but polluted a river.
environmental harm|/ɪnˌvaɪrənˈmentl hɑːrm/|tổn hại môi trường|Oil spills cause serious ____ to coastal areas.
natural ecosystems|/ˈnætʃrəl ˈiːkoʊˌsɪstəmz/|hệ sinh thái tự nhiên|Building roads through forests can destroy ____.
economic growth|/ˌiːkəˈnɑːmɪk ɡroʊθ/|tăng trưởng kinh tế|Some leaders fear that green rules will slow ____.
job creation|/dʒɑːb kriˈeɪʃn/|tạo cơ hội việc làm|Solar farms have led to ____ in rural areas.
living standards|/ˈlɪvɪŋ ˈstændərdz/|mức sống|Rising incomes have improved ____ across the country.
environmental protection|/ɪnˌvaɪrənˈmentl prəˈtekʃn/|bảo vệ môi trường|We need stronger laws on ____ to save our rivers.
public health|/ˈpʌblɪk helθ/|sức khoẻ cộng đồng|Clean air is essential for ____.
sustainable development|/səˈsteɪnəbl dɪˈveləpmənt/|phát triển bền vững|____ meets today's needs without harming future generations.
long-term prosperity|/ˌlɔːŋ ˈtɜːrm prɑːˈsperəti/|sự thịnh vượng lâu dài|Protecting forests today will secure ____ for our children.
natural resources|/ˈnætʃrəl ˈriːsɔːrsɪz/|tài nguyên thiên nhiên|Coal and oil are limited ____ that will not last forever.
short-term profit|/ˌʃɔːrt ˈtɜːrm ˈprɑːfɪt/|lợi nhuận ngắn hạn|Some companies chase ____ and ignore the damage they cause.
renewable energy|/rɪˈnuːəbl ˈenərdʒi/|năng lượng tái tạo|Wind and solar power are forms of ____.
harmful emissions|/ˈhɑːrmfl ɪˈmɪʃnz/|khí thải độc hại|Factories must reduce the ____ released into the air.
single-use packaging|/ˌsɪŋɡl ˈjuːs ˈpækɪdʒɪŋ/|bao bì dùng một lần|Many supermarkets are moving away from ____.
marine ecosystems|/məˈriːn ˈiːkoʊˌsɪstəmz/|hệ sinh thái biển|Coral reefs are among the richest ____ on Earth.
waste management systems|/weɪst ˈmænɪdʒmənt ˈsɪstəmz/|hệ thống quản lí rác thải|Big cities need efficient ____ to handle millions of tonnes of trash.
public health risks|/ˈpʌblɪk helθ rɪsks/|những rủi ro đối với sức khoẻ cộng đồng|Dirty water leads to serious ____ in poor areas.
strict regulations|/strɪkt ˌreɡjuˈleɪʃnz/|các quy định nghiêm ngặt|____ have forced companies to treat their wastewater.
consumer behaviour|/kənˈsuːmər bɪˈheɪvjər/|hành vi người tiêu dùng|Changes in ____ can push brands to become greener.
recycling programmes|/riˈsaɪklɪŋ ˈproʊɡræmz/|các chương trình tái chế|Our school runs ____ to collect paper and bottles.
environmental damage|/ɪnˌvaɪrənˈmentl ˈdæmɪdʒ/|sự tàn phá môi trường|Illegal mining has caused massive ____ in the region.
deposit-return schemes|/dɪˈpɑːzɪt rɪˈtɜːrn skiːmz/|chương trình đặt cọc - hoàn tiền|Under ____, you get money back when you return a bottle.
disposable packaging|/dɪˈspoʊzəbl ˈpækɪdʒɪŋ/|bao bì dùng một lần|Cafés are being urged to stop using ____ for takeaway food.
habitat destruction|/ˈhæbɪtæt dɪˈstrʌkʃn/|sự phá huỷ môi trường sống|____ is the main reason many species are disappearing.
illegal hunting|/ɪˈliːɡl ˈhʌntɪŋ/|săn bắt trái phép|____ has pushed rhinos to the edge of extinction.
climate change|/ˈklaɪmət tʃeɪndʒ/|biến đổi khí hậu|Rising sea levels are a direct result of ____.
biodiversity loss|/ˌbaɪoʊdaɪˈvɜːrsəti lɔːs/|mất đa dạng sinh học|Deforestation is a major cause of ____.
public education|/ˈpʌblɪk ˌedʒuˈkeɪʃn/|giáo dục cộng đồng|____ about recycling should start at school.
protected areas|/prəˈtektɪd ˈeriəz/|các khu bảo tồn|Tourists must follow strict rules inside ____.
anti-poaching laws|/ˌænti ˈpoʊtʃɪŋ lɔːz/|luật chống săn bắt trái phép|Tougher ____ have reduced the killing of elephants.
wildlife conservation|/ˈwaɪldlaɪf ˌkɑːnsərˈveɪʃn/|bảo tồn động vật hoang dã|She donates to ____ projects in Africa.
ecosystem balance|/ˈiːkoʊsɪstəm ˈbæləns/|sự cân bằng hệ sinh thái|Removing top predators can upset ____.
wildlife traffickers|/ˈwaɪldlaɪf ˈtræfɪkərz/|kẻ buôn lậu động vật hoang dã|Police arrested several ____ at the border.
responsible tourism|/rɪˈspɑːnsəbl ˈtʊrɪzəm/|du lịch có trách nhiệm|____ means respecting local people and the environment.`.split('\n').map(l=>{const[en,ipa,vi,s]=l.split('|');return{en,ipa,vi,s}});

const $=s=>document.querySelector(s);
const sh=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[-–]/g,' ').replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();
function lev(a,b){let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));p=c}return p[b.length]}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);

/* ---------- Theme ---------- */
function setTheme(t){document.documentElement.dataset.t=t;try{localStorage.setItem('t',t)}catch(e){}}
let t0=null;try{t0=localStorage.getItem('t')}catch(e){}
setTheme(t0||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));

/* ---------- State ---------- */
let mode='sp',si=0,tab=0,R,q=[];
function take(n){const o=[],skip=[];while(o.length<n){if(!q.length)q=sh(D.map((_,i)=>i));const i=q.shift();if(o.some(x=>D[x].vi==D[i].vi))skip.push(i);else o.push(i)}q=skip.concat(q);return o}
function newRound(){
  const m=take(10),a=take(20),g=take(20),ix=D.map((_,k)=>k);
  R={m:{L:m,Rt:sh(m),p:{},sel:null,done:false,sc:0},
     q:{qs:a.map(i=>({i,o:sh([i,...sh(ix.filter(k=>D[k].vi!=D[i].vi)).slice(0,3)]),a:null})),done:false,sc:0},
     g:{qs:g.map(i=>({i,v:''})),bank:sh(g),done:false,sc:0}};
  tab=0;
}

/* ---------- Speaking ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false,txt='',err='';
function say(rate){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(D[si].en);u.lang='en-US';u.rate=rate;const v=speechSynthesis.getVoices().find(v=>v.lang=='en-US');if(v)u.voice=v;speechSynthesis.speak(u)}
function fb(m,c){const e=$('#fb');if(e){e.className='fb '+(c||'');e.textContent=m}}
function stopRec(){if(rec){rec.onend=null;try{rec.abort()}catch(e){}}listening=false}
function toggleMic(){
  if(!SR){fb('Trình duyệt này chưa hỗ trợ nhận diện giọng nói. Hãy dùng Chrome, Edge hoặc Safari bản mới.','bad');return}
  if(listening){rec.stop();return}
  speechSynthesis.cancel();txt='';err='';
  rec=new SR();rec.lang='en-US';rec.interimResults=true;rec.continuous=true;
  rec.onstart=()=>{listening=true;$('#mic').classList.add('rec');fb('Đang thu âm… nói xong hãy bấm micro lần nữa để dừng.','')};
  rec.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript+' ';txt=t;fb('Đang nghe: '+t,'')};
  rec.onerror=e=>{err=e.error};
  rec.onend=()=>{listening=false;const m=$('#mic');if(m)m.classList.remove('rec');evaluate()};
  try{rec.start()}catch(e){fb('Không mở được micro, hãy thử lại.','bad')}
}
function evaluate(){
  if(err=='not-allowed'||err=='service-not-allowed'){fb('Website chưa được cấp quyền micro. Hãy cho phép micro trong cài đặt trình duyệt rồi thử lại.','bad');return}
  if(!txt.trim()){fb('Chưa nghe thấy giọng nói. Hãy bấm micro, nói rõ hơn rồi bấm dừng.','bad');return}
  const tg=norm(D[si].en),tw=tg.split(' '),heard=norm(txt),sw=heard.split(' ').filter(Boolean);
  const miss=tw.filter(x=>!sw.some(y=>sim(x,y)>=.7));
  const good=(1-miss.length/tw.length>=.8&&sw.length<=tw.length+3)||sim(tg.replace(/ /g,''),heard.replace(/ /g,''))>=.85;
  if(good)fb('✅ Phát âm ổn! Máy nghe được: "'+txt.trim()+'". Bạn có thể sang từ tiếp theo.','ok');
  else fb('⚠️ Chưa ổn. Máy nghe được: "'+txt.trim()+'". '+(miss.length?'Cần luyện: '+miss.join(', ')+'. ':'')+'Hãy nghe mẫu chậm, phát âm rõ từng âm tiết và nói lại, hoặc bỏ qua để sang từ mới.','bad');
}
function spHTML(){const w=D[si];return `<div class="card c"><p class="mu">${si+1} / ${D.length}</p><h2>${w.en}</h2><p class="ipa">${w.ipa}</p><p class="vi">${w.vi}</p>
<div class="row"><button class="b" data-a="say">🔊 Nghe mẫu</button><button class="b" data-a="slow">🐢 Nghe chậm</button></div>
<button id="mic" class="mic" data-a="mic" aria-label="Bật/tắt micro">🎤</button><p class="mu">Bấm micro để nói, bấm lần nữa để dừng và chấm.</p>
<div id="fb" class="fb"></div>
<div class="row"><button class="b" data-a="prev" ${si?'':'disabled'}>← Từ trước</button><button class="b" data-a="skip">Bỏ qua / Từ tiếp →</button></div></div>`}

/* ---------- Reading ---------- */
function rM(){
  const m=R.m,vi=i=>D[i].vi,ok=l=>vi(m.L[l])==vi(m.Rt[m.p[l]]);
  const rp={};for(const l in m.p)rp[m.p[l]]=+l;
  let h='<p class="mu">Bấm một từ tiếng Anh, rồi bấm nghĩa tiếng Việt tương ứng. Bấm lại vào từ đã nối để bỏ nối.</p><div class="mt"><div>';
  m.L.forEach((w,l)=>{const c=m.p[l]!==undefined,st=m.done?(ok(l)?'ok':'bd'):'';h+=`<button class="it ${c?'lk':''} ${m.sel===l?'sel':''} ${st}" style="--h:${l*36}" data-l="${l}">${D[w].en}</button>`});
  h+='</div><div>';
  m.Rt.forEach((w,r)=>{const l=rp[r],c=l!==undefined,st=m.done&&c?(ok(l)?'ok':'bd'):'';h+=`<button class="it ${c?'lk':''} ${st}" ${c?`style="--h:${l*36}"`:''} data-r="${r}">${D[w].vi}</button>`});
  h+='</div></div>';
  if(m.done){
    const bad=m.L.filter((w,l)=>!ok(l));
    h+=`<p class="sc">Kết quả: ${m.sc}/10</p>`+bad.map(w=>`<p class="fix">${D[w].en} = ${D[w].vi}</p>`).join('')+'<button class="b pr" data-a="go" data-v="1">Sang phần Trắc nghiệm →</button>';
  }else h+='<p id="msg" class="mu"></p><button class="b pr" data-a="ckM">Kiểm tra</button>';
  return h;
}
function rQ(){
  const m=R.q;let h='<p class="mu">Chọn từ phù hợp nhất để điền vào chỗ trống.</p>';
  m.qs.forEach((x,n)=>{const w=D[x.i],p=w.s.split('____');
    h+=`<div class="qc"><p>${n+1}. ${p[0]}<span class="bl">${x.a!==null?D[x.o[x.a]].en:'_____'}</span>${p[1]}</p><div class="op">`;
    x.o.forEach((o,k)=>{let c=x.a===k?'sel':'';if(m.done){if(D[o].vi==w.vi)c+=' ok';else if(x.a===k)c+=' bd'}
      h+=`<button class="it ${c}" data-q="${n}" data-o="${k}">${D[o].en}</button>`});
    h+='</div></div>'});
  h+=m.done?`<p class="sc">Kết quả: ${m.sc}/20</p><button class="b pr" data-a="go" data-v="2">Sang phần Điền từ →</button>`:'<button class="b pr" data-a="ckQ">Kiểm tra kết quả</button>';
  return h;
}
function rG(){
  const m=R.g;let h='<p class="mu">Điền từ/cụm từ thích hợp vào mỗi chỗ trống (dùng các từ trong khung, đã xáo trộn).</p><div class="bank">'+m.bank.map(i=>`<span>${D[i].en}</span>`).join('')+'</div>';
  m.qs.forEach((x,n)=>{const p=D[x.i].s.split('____');
    h+=`<div class="qc"><p>${n+1}. ${p[0]}<input data-g="${n}" value="${x.v}" class="${m.done?(x.ok?'ok':'bd'):''}" ${m.done?'disabled':''} autocomplete="off" autocapitalize="off" spellcheck="false">${p[1]}</p>${m.done&&!x.ok?`<p class="fix">Đáp án: ${D[x.i].en}</p>`:''}</div>`});
  h+=m.done?`<p class="sc">Kết quả: ${m.sc}/20</p><button class="b pr" data-a="sum">Xem tổng kết</button>`:'<button class="b pr" data-a="ckG">Kiểm tra</button>';
  return h;
}
function rdHTML(){
  const T=['1. Nối từ','2. Trắc nghiệm','3. Điền từ'];
  return `<div class="tabs sub">${T.map((t,i)=>`<button class="${i==tab?'on':''}" data-a="go" data-v="${i}">${t}</button>`).join('')}</div>`+[rM,rQ,rG][tab]();
}
function showSum(){
  const M=R.m,Q=R.q,G=R.g,t=M.sc+Q.sc+G.sc,p=t/50,W=new Set();
  M.L.forEach((w,l)=>{if(M.done&&D[w].vi!=D[M.Rt[M.p[l]]].vi)W.add(w)});
  Q.qs.forEach(x=>{if(Q.done&&(x.a===null||D[x.o[x.a]].vi!=D[x.i].vi))W.add(x.i)});
  G.qs.forEach(x=>{if(G.done&&!x.ok)W.add(x.i)});
  const adv=p>=.9?'Xuất sắc! Bạn đã nắm rất chắc chủ đề này. Hãy làm lại để gặp thêm từ mới và thử đặt câu riêng với từng cụm từ.':p>=.7?'Khá tốt! Hãy xem lại những từ sai bên dưới, viết mỗi từ vào một câu của riêng bạn rồi làm lại.':p>=.5?'Bạn đã nhớ được một nửa. Hãy luyện Speaking để nhớ cả nghĩa lẫn cách đọc, ôn lại từ sai rồi làm lại.':'Đừng nản, chủ đề này khá nhiều cụm từ dài. Hãy học theo nhóm nhỏ (8-10 cụm/lần), luyện Speaking từng từ rồi làm lại.';
  $('#mb').innerHTML=`<p class="mu">Tổng kết</p><p class="big">${t}/50</p><p>Nối từ ${M.sc}/10 · Trắc nghiệm ${Q.sc}/20 · Điền từ ${G.sc}/20</p><p>${adv}</p>`+
   (W.size?`<p class="sc">Từ cần ôn lại</p>`+[...W].map(i=>`<p class="fix" style="color:var(--tx)">${D[i].en} — ${D[i].vi}</p>`).join(''):'')+
   `<div class="row"><button class="b" data-a="close">Đóng</button><button class="b pr" style="margin:0" data-a="again">Làm lại (từ mới)</button></div>`;
  $('#md').classList.add('on');
}

/* ---------- View ---------- */
function view(){
  document.querySelectorAll('[data-a=mode]').forEach(b=>b.classList.toggle('on',b.dataset.v==mode));
  $('#app').innerHTML=mode=='sp'?spHTML():rdHTML();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.l!==undefined){const m=R.m,l=+d.l;if(m.done)return;if(m.p[l]!==undefined)delete m.p[l];else m.sel=l;view();return}
  if(d.r!==undefined){const m=R.m,r=+d.r;if(m.done)return;const l=Object.keys(m.p).find(k=>m.p[k]===r);
    if(l!==undefined)delete m.p[l];else if(m.sel!==null){m.p[m.sel]=r;m.sel=null}view();return}
  if(d.q!==undefined){const m=R.q,n=+d.q,k=+d.o;if(m.done)return;m.qs[n].a=k;
    b.parentNode.querySelectorAll('.it').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
    b.closest('.qc').querySelector('.bl').textContent=D[m.qs[n].o[k]].en;return}
  switch(d.a){
    case'theme':setTheme(document.documentElement.dataset.t=='dark'?'light':'dark');break;
    case'mode':stopRec();speechSynthesis.cancel();mode=d.v;view();break;
    case'say':say(1);break;
    case'slow':say(.6);break;
    case'mic':toggleMic();break;
    case'prev':stopRec();si=Math.max(0,si-1);view();break;
    case'skip':stopRec();speechSynthesis.cancel();si=(si+1)%D.length;view();break;
    case'go':tab=+d.v;view();scrollTo(0,0);break;
    case'ckM':{const m=R.m;if(Object.keys(m.p).length<10){$('#msg').textContent='Hãy nối đủ 10 từ trước khi kiểm tra.';return}
      m.sc=m.L.filter((w,l)=>D[w].vi==D[m.Rt[m.p[l]]].vi).length;m.done=true;view();break}
    case'ckQ':{const m=R.q;m.sc=m.qs.filter(x=>x.a!==null&&D[x.o[x.a]].vi==D[x.i].vi).length;m.done=true;view();break}
    case'ckG':{const m=R.g;m.qs.forEach(x=>{x.ok=D.some(w=>w.vi==D[x.i].vi&&norm(w.en)==norm(x.v))});
      m.sc=m.qs.filter(x=>x.ok).length;m.done=true;view();showSum();break}
    case'sum':showSum();break;
    case'close':$('#md').classList.remove('on');break;
    case'again':$('#md').classList.remove('on');newRound();view();scrollTo(0,0);break;
  }
});
document.addEventListener('input',e=>{const n=e.target.dataset.g;if(n!==undefined)R.g.qs[+n].v=e.target.value});
newRound();view();
</script>
